[dataset]
schema_version = "vision-dataset-v4"
base_seed = 20260911
split_salt = "ebabil-vision-v4c"
train_scene_count = 64
validation_scene_count = 8
development_ood_scene_count = 8
audit_scene_count = 12
samples_per_scene = 8
visual_distractor_count = 4
train_obstacle_geometries = ["box", "cylinder", "capsule", "sphere"]
validation_obstacle_geometries = ["box", "cylinder", "capsule", "sphere"]
development_ood_obstacle_geometries = ["box", "cylinder", "capsule", "sphere"]
audit_obstacle_geometries = ["ellipsoid"]
scene_mode = "random_obstacles"
endpoint_mode = "random_both"
minimum_progress = 0.0
maximum_progress = 1.0
maximum_lateral_offset_m = 1.25
minimum_altitude_m = 0.80
maximum_altitude_m = 2.10
maximum_yaw_jitter_deg = 35.0
target_negative_fraction = 0.30
# REV-019: ADR-012 hover zarfından örneklenen poz ailesi. Rota ailesi tek başına
# hold pozunu yalnız ~%1 temsil ediyordu; terminal görevin target_score kapısı
# bu bölgeye dayandığı için açıkça örnekleniyor.
hold_pose_fraction = 0.20
negative_yaw_min_deg = 70.0
negative_yaw_max_deg = 140.0
free_space_max_depth_m = 8.0
minimum_target_pixels = 8

