[model]
schema_version = "vision-encoder-v11"
input_width_px = 96
input_height_px = 72
latent_size = 64
adaptive_exposure_target_mean = 0.25
adaptive_exposure_min_gain = 0.50
adaptive_exposure_max_gain = 4.00
collision_risk_score_threshold = 0.62
# REV-021: risk head kapasitesi. v9 tek doğrusal katmandı (latent -> 3) ve
# zorlaştırılmış v4c dağılımında altı risk kapısını birlikte geçemedi.
risk_head_hidden_size = 64

[training]
seed = 20260911
epochs = 45
batch_size = 32
learning_rate = 0.001
target_visibility_weight = 1.0
target_center_weight = 3.0
free_space_weight = 1.0
target_mask_weight = 0.75
obstacle_mask_weight = 0.50
mask_positive_weight = 3.0
collision_risk_weight = 1.5
# Risk BCE'sinde pozitif sınıf ağırlığı (REV-020). `1.0` ağırlıksız BCE ile
# matematiksel olarak aynıdır ve onaylı `vision-encoder-v9` bu değerle tekrar
# üretilebilir. `2.0` ve `3.0` değerleri `vision-dataset-v4c` üzerinde ölçüldü;
# ikisi de altı risk kapısının tamamını aynı anda geçirmedi (REV-021). Kalibrasyon
# D0-V risk head çalışmasına bırakıldı.
collision_risk_positive_weight = 2.0
collision_risk_threshold = 0.25
grayscale_augmentation_probability = 0.50
latency_warmup_runs = 5
latency_measurement_runs = 50

# REV-037: engel haritası kalite kapısı. Politikaya `obstacle_map` kanalı
# verilecek (vision-v2) ve şu ana kadar bu çıktı HİÇ ölçülmemişti.
[quality]
model_seeds = [20260911, 20260912, 20260913]
minimum_target_precision = 0.78
minimum_target_recall = 0.85
maximum_target_center_error = 0.30
maximum_free_space_mae = 0.30
minimum_free_space_improvement = 0.15
minimum_risk_precision = 0.65
minimum_risk_recall = 0.70
# REV-038: `collision_risk` kanalı actor observation'ından ÇIKARILDI ve
# approval kapısı olmaktan çıktı. Etiketi tanım gereği
# `free_space < collision_risk_threshold`'dı, yani politikanın zaten sahip
# olduğu kanalın eşiklenmiş kopyası; `obstacle_map` (108 hücre) aynı bilgiyi
# kat kat yüksek çözünürlükte taşır. Ölçülen: D1 dataset'inde free_space
# regresyonu İYİLEŞTİ (2.06 -> 1.05 m) fakat 0.25 eşiğine göre evet/hayır
# sınıflandırması zorlaştı, çünkü dağılımın standart sapması 0.42'den 0.355'e
# indi ve daha fazla örnek eşiğin yakınına düştü.
# Eşikler raporlanmaya devam etsin diye burada kalır fakat kapı değildir.
gate_collision_risk = false
minimum_risk_specificity = 0.50
# Engel haritası (9 x 12 mesafe x yön ızgarası). Eşikler ilk ölçümden sonra
# kalibre edilecek; aşağıdaki değerler "kullanılabilir harita" alt sınırıdır.
minimum_obstacle_map_iou = 0.30
minimum_obstacle_map_precision = 0.45
minimum_obstacle_map_recall = 0.55
