# ADR-022 kademe 1: etiketsiz VAE latent'i (vision-v3) ile D1a (5 engel).
# PPO hiperparametreleri ppo_vision_d1a.toml ile BİREBİR aynıdır ki ölçülen
# fark yalnız algı katmanına atfedilebilsin. approval_manifest etiketsiz VAE
# zincirinin manifest'idir (kind = "visual-vae"); etiketli zincirin manifest'i
# yükleyici tarafından reddedilir.
[run]
total_timesteps = 600000
seed = 20260912
n_envs = 4
vector_backend = "subproc"

[environment]
kind = "latent_vision"
scene_mode = "random_obstacles"
endpoint_mode = "random_both"
approval_manifest = "runs/vae_audit_v1_20260923/approval_manifest.json"
scene_config_path = "src/ebabil/configs/environment/static_scene_d1a.toml"
# Eğitim görsel alanı; evaluation "validation" (held-out) alanını ayrıca koşar.
visual_domain_split = "train"

[ppo]
learning_rate = 0.0003
n_steps = 512
batch_size = 256
n_epochs = 10
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.0
vf_coef = 0.5
max_grad_norm = 0.5
network_arch = [256, 256]

[normalization]
observations = false
rewards = true
clip_observation = 10.0
clip_reward = 10.0

[checkpoint]
save_frequency_timesteps = 100000
evaluation_frequency_timesteps = 50000
evaluation_episodes = 10

[logging]
tensorboard = true
